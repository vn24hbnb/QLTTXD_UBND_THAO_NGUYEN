services:
  app:
    build: .
    container_name: qlttxd-thao-nguyen
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    # Tạo .env.production (không đưa lên Git) theo mục "Cấu hình production" trong README.
    env_file: .env.production
    read_only: true
    tmpfs:
      - /tmp
